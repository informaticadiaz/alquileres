login:
  oidc:
    error:
      already_linked: >-
        Este usuario ya está vinculado a otra cuenta de SSO. Comuníquese con su
        administrador.
      ambiguous: >-
        Esta dirección de correo electrónico pertenece a más de un usuario.
        Comuníquese con su administrador.
      disabled: >-
        El inicio de sesión por SSO no está disponible en este momento.
        Comuníquese con su administrador.
      email_unverified: >-
        Su proveedor de identidad no confirmó su dirección de correo
        electrónico, por lo que no es posible iniciar sesión.
      inactive: Esta cuenta de usuario está desactivada.
      no_match: >-
        No existe un usuario de FewohBee para esta cuenta. Solicite a su
        administrador que cree uno.
      password_disabled: >-
        El inicio de sesión con contraseña está deshabilitado. Inicie sesión
        mediante SSO.
      provider: Se canceló el inicio de sesión.
      state: >-
        El inicio de sesión expiró o se interrumpió. Vuelva a intentarlo.
      token: >-
        No se pudo completar el inicio de sesión. Vuelva a intentarlo.
