login:
  oidc:
    error:
      already_linked: >-
        Este usuario ya está vinculado a otra cuenta de SSO. Comunícate con tu
        administrador.
      ambiguous: >-
        Esta dirección de correo electrónico pertenece a más de un usuario.
        Comunícate con tu administrador.
      disabled: >-
        El inicio de sesión por SSO no está disponible en este momento.
        Comunícate con tu administrador.
      email_unverified: >-
        Tu proveedor de identidad no confirmó tu dirección de correo
        electrónico, por lo que no es posible iniciar sesión.
      inactive: Esta cuenta de usuario está desactivada.
      no_match: >-
        No existe un usuario de FewohBee para esta cuenta. Pídele a tu
        administrador que cree uno.
      password_disabled: >-
        El inicio de sesión con contraseña está deshabilitado. Inicia sesión
        mediante SSO.
      provider: Se canceló el inicio de sesión.
      state: >-
        El inicio de sesión expiró o se interrumpió. Vuelve a intentarlo.
      token: >-
        No se pudo completar el inicio de sesión. Vuelve a intentarlo.
