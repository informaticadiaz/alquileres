booking_rules:
    section_rules: "Reglas de reserva"
    section_rules_desc: "Define cuánto tiempo deben quedarse los huéspedes y en qué días no es posible la llegada o la salida. Sin una regla, alcanza con una sola noche."
    section_periods: "Períodos especiales"
    section_periods_desc: "Reglas distintas para un rango de fechas, por ejemplo días festivos o temporada alta. En los días que abarcan reemplazan por completo las estancias mínimas de las reglas generales, incluso con un valor menor. Los cierres de llegada y salida siguen vigentes."
    section_calendar: "Calendario"
    section_calendar_desc: "Qué se aplica cada día. La fila superior combina todas las reglas y el tooltip explica los valores marcados. Haz clic en una regla para resaltar sus días."

