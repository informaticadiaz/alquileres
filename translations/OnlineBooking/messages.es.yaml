    mode_help: "Determina cómo eligen los huéspedes su estancia en la página pública de reservas."
    mode_search: "Búsqueda"
    mode_search_help: "Los huéspedes ingresan un período, la cantidad de personas y de habitaciones, y eligen entre los tipos de habitación que coinciden. Es la opción adecuada en cuanto se puede reservar más de una habitación."
    mode_calendar: "Calendario"
    mode_calendar_help: "Los huéspedes ven la ocupación de un alojamiento y eligen su estancia directamente en el calendario. Recomendado para alojamientos individuales. Requiere el diseño \"Moderno\"."
    mode_calendar_limits: "El calendario siempre reserva <strong>exactamente un alojamiento</strong>. Si hay varias habitaciones habilitadas, los huéspedes pueden cambiar entre ellas, pero al cambiar se descarta la selección actual y no es posible reservar varias habitaciones a la vez. Para eso está la búsqueda.<br><br>Las habitaciones configuradas con <strong>ocupación múltiple</strong> no aparecen en el calendario porque sus noches se comparten entre varias reservas. Siguen siendo reservables mediante la búsqueda."
    calendar_needs_modern: "El calendario solo aparece con el diseño \"Moderno\". Mientras esté seleccionado \"Clásico\", los huéspedes seguirán viendo la búsqueda."
    calendar_no_rooms: "Actualmente el calendario no se muestra: ninguna de las habitaciones habilitadas cumple los requisitos. Las habitaciones con ocupación múltiple se excluyen porque sus noches se comparten entre varias reservas. Habilita una habitación sin ocupación múltiple para que aparezca el calendario."
    calendar_many_rooms: "Hay %count% habitaciones habilitadas para el calendario. Allí los huéspedes solo pueden elegir un alojamiento por reserva; con varias habitaciones, la búsqueda suele ser la mejor opción."
    custom_css: "CSS personalizado"
    custom_css_help: "Avanzado: reglas CSS personalizadas que se cargan después de los estilos predeterminados. Úsalas para sobrescribir fuentes, colores, espaciados, etc. Antepón <code>.fhb-booking-root</code> a los selectores. El diseño \"Moderno\" expone además las variables <code>--fhb-primary</code>, <code>--fhb-bg</code>, <code>--fhb-surface</code>, <code>--fhb-text</code>, <code>--fhb-border</code>, <code>--fhb-radius</code>, <code>--fhb-shadow</code>, <code>--fhb-font-family</code> y <code>--fhb-space</code>."
    confirmation_workflow_help: "La confirmación al huésped se gestiona como una automatización. Configura allí su plantilla, los adjuntos y las condiciones adicionales, o desactiva el envío por completo."
    confirmation_workflow_missing: "Falta la automatización de confirmación al huésped. Ejecuta las migraciones de base de datos pendientes."
