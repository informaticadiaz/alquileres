    allowed_embedding_origins_help: "Ingresa un sitio web por línea en el que los visitantes deban ver el formulario de reserva. Las variantes cuentan por separado, por ejemplo <code>https://www.example-hotel.com</code> y <code>https://example-hotel.com</code>. Si el sitio web también es accesible mediante otras direcciones, agrégalas también. Déjalo vacío si el formulario solo se abre directamente en esta aplicación."
