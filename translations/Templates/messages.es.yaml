templates.editor.check_in_times: Horarios de check-in del establecimiento
templates.editor.check_in_times.desc: >-
  Imprime el horario de check-in y la hora de check-out del establecimiento en una sola línea, p. ej.,
  "Check-in 17:00-20:00 - Check-out hasta las 10:00". Son normas de la casa, no la hora de llegada
  de esta reserva en particular. El párrafo se omite cuando no hay horarios configurados.
templates.editor.opening_hours.desc: 'Imprime el horario de atención semanal del establecimiento en una sola línea, p. ej., "Lu–Vi 08:00–12:00, 16:00–19:00". El párrafo se omite cuando no hay horarios configurados.'
templates.editor.payment_qr: Código QR de pago (GiroCode)
templates.editor.payment_qr.desc: >-
  Inserta un código QR que completa una transferencia SEPA en la aplicación
  bancaria del pagador. El número es la resolución de la imagen en píxeles; el
  tamaño con que aparece en la página es el ancho propio de la imagen, que se
  ajusta con el control de redimensionado. El código solo aparece cuando los
  datos bancarios están configurados en la configuración de facturas y la
  instalación funciona en euros.
templates.editor.payment_due_date: Fecha de vencimiento del pago
templates.editor.payment_due_date.desc: >-
  Inserta el día en que vence el pago, tomado del plazo de pago de la
  configuración de facturas, para que la fecha impresa y la factura electrónica
  siempre coincidan. La línea se omite cuando la configuración no indica un
  plazo.
templates.editor.tourist_tax.positions.desc: >-
  Inserta una tabla con todas las posiciones de tasa turística / impuesto de
  alojamiento. La tabla solo se genera cuando existen esas posiciones en la
  factura.
