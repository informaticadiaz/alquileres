guest_category_modifier:
  title: "Recargos / descuentos por categoría"
  description: "Define un recargo, descuento, tarifa fija o \"gratis\" por categoría de huésped sobre la tarifa por noche. La tarifa de adulto sigue siendo el precio base. Los modificadores solo se aplican a tarifas por noche calculadas por persona, no a precios de tarifa plana ni por habitación."
  threshold_hint: "A partir de qué ocupación se aplican estos modificadores (mínimo de huéspedes con tarifa completa) se configura en cada categoría de habitación; p. ej., para que los niños solo tengan descuento a partir de 3 huéspedes."
  add: "Agregar modificador"
  empty: "Todavía no hay modificadores configurados: las tarifas por noche se aplican sin cambios para todas las categorías."
  delete:
    ask: "¿Seguro que quieres eliminar este modificador?"

  type:
    surcharge_absolute: "Recargo (importe)"
    discount_percent: "Descuento (%)"
    flat_rate: "Tarifa fija por noche"
    free: "Gratis"

  field:
    category: "Categoría de huésped"
    category.help: "Solo se listan las categorías sobre las que puede actuar un modificador: ninguna categoría de adultos (son la tarifa base) y solo las categorías que cuentan para la ocupación de la habitación. Los huéspedes que no ocupan cama (p. ej., bebés en cuna) no se facturan en la línea de la habitación."
    type: "Tipo de modificador"
    type.help: "El recargo suma un importe a la tarifa de adulto. El descuento resta un porcentaje. La tarifa fija reemplaza la tarifa de adulto. Gratis = 0.00."
    value: "Valor"
    value.help: "Importe en la moneda configurada para recargo/tarifa fija, porcentaje para descuento. Se ignora para \"Gratis\"."
    valid_from: "Válido desde"
    valid_to: "Válido hasta"
    sort_order: "Orden"
    active: "Activo"

