price.revenue_account.default: Predeterminada (según el tipo de impuesto)
price.revenue_account.help: >-
  Opcional y solo se usa en flujos de trabajo. Indica a qué cuenta de ingresos
  se contabiliza este precio en el libro diario. Si está vacía, se usa la
  cuenta predeterminada del tipo de impuesto (p. ej., 8300 para 7 %, 8400 para
  19 %). Es útil cuando ciertos ingresos (comida, bebidas, tasa turística)
  deben ir a cuentas separadas.
price.package.remainder.help: >-
  Marca este componente como resto. Su valor se calcula automáticamente con lo
  que queda después de restar todos los demás componentes del precio total. Es
  útil cuando se combinan componentes porcentuales y de importe fijo, o para
  absorber centavos de redondeo. Solo un componente por paquete puede marcarse
  como resto.
