# alquileres.diazignacio.ar — nginx front for the Osclass origin.
# Bound to 127.0.0.1:8783, the port the Cloudflare Tunnel already targets, so no tunnel change is
# needed. Every request is proxied to the PHP built-in server (osclass.service on 127.0.0.1:8784);
# nginx serves no files itself, so www-data never needs traversal into /home/ignacio (750).
# Its job here is to block internal files the PHP built-in server would otherwise serve verbatim
# (installer SQL, changelogs, plugin docs, translation catalogs, dotfiles) and add security headers.
#
# Install: sudo install -m 644 nginx/alquileres.conf /etc/nginx/sites-available/alquileres
#          sudo ln -s /etc/nginx/sites-available/alquileres /etc/nginx/sites-enabled/alquileres
server {
    listen 127.0.0.1:8783;
    server_name _;

    client_max_body_size 16m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Dotfiles (.git, .github, .gitignore, ...), except ACME-style well-known paths.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Installer and sample config: the site is installed, these are never needed publicly.
    location ^~ /oc-includes/osclass/installer/ {
        return 404;
    }
    location ~ ^/(oc-includes/osclass/install[^/]*\.php|config-sample\.php)$ {
        return 404;
    }

    # Documentation, licenses, SQL, translation catalogs, package metadata and archives.
    location ~* \.(sql|md|txt|po|pot|mo|log|bak|old|orig|swp|zip|tar|gz|sh|lock|ya?ml|dist)$ {
        return 404;
    }
    location ~* (^|/)(composer|package)\.json$ {
        return 404;
    }
    location ~ ^/LICENSE {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8784;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # X-Forwarded-Proto, X-Forwarded-For and CF-Connecting-IP from cloudflared pass through
        # unchanged. The removal form trusts CF-Connecting-IP only when REMOTE_ADDR is loopback,
        # which still holds because nginx connects to PHP from 127.0.0.1.
        proxy_read_timeout 120s;
    }
}
