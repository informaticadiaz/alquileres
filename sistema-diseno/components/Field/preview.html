<!-- @dsCard group="Forms" height=210 subtitle="Text input and select" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Field</title></head>
<body>
<div class="at-row" style="align-items: flex-start;">
  <div class="at-field" style="flex: 1 1 240px;">
    <label for="f-nombre">Nombre del alojamiento</label>
    <input class="at-input" id="f-nombre" type="text" value="Cabañas del Río" aria-describedby="f-nombre-ayuda">
    <p class="at-help" id="f-nombre-ayuda" style="margin: 0;">Como figura en tu cartel o sitio oficial.</p>
  </div>
  <div class="at-field" style="flex: 1 1 200px;">
    <label for="f-tipo">Tipo de alojamiento</label>
    <select class="at-select" id="f-tipo">
      <option>Cabaña</option>
      <option>Apart hotel</option>
    </select>
  </div>
</div>
</body>
</html>
