framework:
    default_locale: '%locale%'
    # es: Spanish translation of this fork, made from the English files.
    enabled_locales: ['de', 'en', 'es']
    translator:
        # English first so Spanish falls back to its source language; English still falls back to German.
        fallbacks: ['en', 'de']
        default_path: '%kernel.project_dir%/translations'
