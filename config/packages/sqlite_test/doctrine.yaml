doctrine:
    dbal:
        # SQLite compares dates as text; see App\Doctrine\SqliteDateType.
        types:
            date: App\Doctrine\SqliteDateType
            date_immutable: App\Doctrine\SqliteDateImmutableType
        connections:
            default:
                driver: 'pdo_sqlite'
                url: 'sqlite:///%kernel.project_dir%/var/sqlite-test/fewohbee.sqlite'
                server_version: null
                charset: null
                default_table_options: []
            geo:
                driver: 'pdo_sqlite'
                url: 'sqlite:///%kernel.project_dir%/var/sqlite-test/fewohbee.sqlite'
                server_version: null
                charset: null
                default_table_options: []
