# Shared Doctrine settings of the SQLite profiles (sqlite_test, sqlite_prod).
# Each profile imports this file and defines the fewohbee.sqlite_path parameter.
doctrine:
    dbal:
        # SQLite compares dates as text; see App\Doctrine\SqliteDateType.
        types:
            date: App\Doctrine\SqliteDateType
            date_immutable: App\Doctrine\SqliteDateImmutableType
        connections:
            default:
                driver: 'pdo_sqlite'
                url: null
                path: '%fewohbee.sqlite_path%'
                server_version: null
                charset: null
                default_table_options: []
                # Both connections share one file: skip the baseline bookkeeping table
                # (no entity mapping) and the table owned by the geo connection. The
                # migrations table must stay visible: Doctrine Migrations checks for it
                # through this filter, and its bundle hides it from schema commands itself.
                schema_filter: '~^(?!(fewohbee_sqlite_baseline_metadata|postal_code_data)$)~'
            geo:
                driver: 'pdo_sqlite'
                url: null
                path: '%fewohbee.sqlite_path%'
                server_version: null
                charset: null
                default_table_options: []
                schema_filter: '~^postal_code_data$~'
